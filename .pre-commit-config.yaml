repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-merge-conflict
-   repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
    -   id: black
        language_version: python3
        args: [--line-length=100]
-   repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
    -   id: flake8
        additional_dependencies: [flake8-docstrings]
        args: [--max-line-length, "100", --max-complexity, "20", --ignore, "F401,E501,C901,E203,E402,E711,F841,W503,D100,D101,D102,D103,D104,D105,D107,D200,D202,D205,D209,D400,D401"]
        exclude: "src/uoapi/course/patterns.py"
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
    -   id: mypy
        additional_dependencies: [pydantic<2, types-requests, RateMyProfessorAPI]
        args: [--ignore-missing-imports]
        exclude: "src/uoapi/(rmp/rate_my_prof|timetable/query_timetable|course/course_info|dates/important_dates).py"